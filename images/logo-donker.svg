    <rect x="70" y="100" width="5" height="5"/><rect x="80" y="100" width="5" height="5"/>
    <rect x="90" y="100" width="5" height="5"/><rect x="100" y="100" width="5" height="5"/>
    <rect x="110" y="100" width="5" height="5"/><rect x="120" y="100" width="5" height="5"/>
    <rect x="130" y="100" width="5" height="5"/><rect x="140" y="100" width="5" height="5"/>
    <rect x="55" y="105" width="5" height="5"/><rect x="65" y="105" width="5" height="5"/>
    <rect x="75" y="105" width="5" height="5"/><rect x="85" y="105" width="5" height="5"/>
    <rect x="95" y="105" width="5" height="5"/><rect x="105" y="105" width="5" height="5"/>
    <rect x="115" y="105" width="5" height="5"/><rect x="125" y="105" width="5" height="5"/>
    <rect x="135" y="105" width="5" height="5"/><rect x="145" y="105" width="5" height="5"/>
  </g>

  <!-- Wielen -->
  <circle cx="70" cy="122" r="12" fill="#111" stroke="#FFC400" stroke-width="3"/>
  <circle cx="70" cy="122" r="4" fill="#FFC400"/>
  <circle cx="131" cy="122" r="12" fill="#111" stroke="#FFC400" stroke-width="3"/>
  <circle cx="131" cy="122" r="4" fill="#FFC400"/>

