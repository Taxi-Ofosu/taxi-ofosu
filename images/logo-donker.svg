    <tspan fill="#ffffff">Centraal </tspan><tspan fill="#E8A900">Taxi</tspan>
  </text>
  <rect x="210" y="114" width="392" height="4" rx="2" fill="#FFC400"/>
  <text x="208" y="160" textLength="392" lengthAdjust="spacing" font-family="Montserrat, 'Arial Black', Arial, sans-serif" font-weight="900" font-size="40" fill="#ffffff">ANTWERPEN</text>
