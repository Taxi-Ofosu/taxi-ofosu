<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 10 600 180" width="600" height="180">
  <title>Centraal Taxi Antwerpen</title>

  <!-- Embleem -->
  <circle cx="100" cy="100" r="84" fill="#FFC400"/>
  <circle cx="100" cy="100" r="84" fill="none" stroke="#111" stroke-width="6"/>

  <!-- Daklicht -->
  <rect x="94" y="60" width="32" height="12" rx="3" fill="#111"/>
  <text x="110" y="69.5" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="8.5" fill="#FFC400" letter-spacing="0.5">TAXI</text>

  <!-- Auto -->
  <path fill="#111" d="M42,121 L42,106 Q44,97 56,95 L74,93 L87,78 Q90,74 96,74 L124,74 Q130,74 134,79 L145,93 L152,95 Q158,97 158,105 L158,121 Z"/>
  <path fill="#FFC400" d="M92,91 L99,80 L109,80 L109,91 Z"/>
  <path fill="#FFC400" d="M114,91 L114,80 L124,80 Q127,80 129,83 L135,91 Z"/>

